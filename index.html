<style>html{background:#0D0D0D}body{background:#0D0D0D;margin:0}
/* ===== FIQ preloader (только "/", инлайн — виден до загрузки бандла) ===== */
#fiqLoader{position:fixed;inset:0;z-index:12000;background:#0D0D0D;opacity:1;transition:opacity .55s ease;contain:strict}
#fiqLoader.fl-out{opacity:0;pointer-events:none}
#fiqLoader canvas{position:absolute;inset:0;display:block}
#fiqLoader .fl-ui{position:absolute;inset:0;color:#F5F5F0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:opacity .4s ease,transform .4s ease}
#fiqLoader.fl-go .fl-ui{opacity:0;transform:translateY(-8px)}
#fiqLoader .fl-c{position:absolute;width:16px;height:16px;border:0 solid rgba(184,255,0,.55)}
#fiqLoader .fl-c1{top:20px;left:24px;border-top-width:1px;border-left-width:1px}
#fiqLoader .fl-c2{top:20px;right:24px;border-top-width:1px;border-right-width:1px}
#fiqLoader .fl-c3{bottom:18px;left:24px;border-bottom-width:1px;border-left-width:1px}
#fiqLoader .fl-c4{bottom:18px;right:24px;border-bottom-width:1px;border-right-width:1px}
#fiqLoader .fl-tl{position:absolute;top:26px;left:52px}
#fiqLoader .fl-tl b{font-weight:400;color:#B8FF00}
#fiqLoader .fl-tr{position:absolute;top:26px;right:52px;color:rgba(245,245,240,.55)}
#fiqLoader .fl-bl{position:absolute;bottom:26px;left:52px;color:rgba(245,245,240,.62)}
#fiqLoader .fl-bl i{display:inline-block;width:7px;height:12px;margin-left:8px;background:#B8FF00;vertical-align:-2px;animation:flBlink 1s steps(2) infinite}
@keyframes flBlink{50%{opacity:0}}
#fiqLoader .fl-pct{position:absolute;bottom:16px;right:52px;color:#B8FF00;font-size:clamp(30px,4.6vw,46px);letter-spacing:.06em;font-weight:500;font-variant-numeric:tabular-nums}
#fiqLoader .fl-pct em{font-style:normal;font-size:.42em;color:rgba(184,255,0,.55);margin-left:2px}
#fiqLoader .fl-bar{position:absolute;left:0;bottom:0;width:100%;height:2px;background:rgba(184,255,0,.12)}
#fiqLoader .fl-bar i{position:absolute;inset:0;background:#B8FF00;transform-origin:left;transform:scaleX(0);box-shadow:0 0 12px rgba(184,255,0,.8)}
@media (max-width:640px){#fiqLoader .fl-tr{display:none}#fiqLoader .fl-tl{left:48px}#fiqLoader .fl-bl{left:48px}#fiqLoader .fl-pct{right:48px}}
</style>

<body>
<div id="fiqLoader" aria-hidden="true">
  <canvas id="flCv"></canvas>
  <div class="fl-ui">
    <span class="fl-c fl-c1"></span><span class="fl-c fl-c2"></span><span class="fl-c fl-c3"></span><span class="fl-c fl-c4"></span>
    <div class="fl-tl">Fastline <b>InfinitiQ</b></div>
    <div class="fl-tr">AI-Native Agency</div>
    <div class="fl-bl">Inicjalizacja sieci<i></i></div>
    <div class="fl-pct"><span id="flNum">00</span><em>%</em></div>
    <div class="fl-bar"><i id="flBar"></i></div>
  </div>
</div>
<script>
/* FIQ preloader: 3D-сетка → морф в спираль нейро-столпа. Vanilla, 0 зависимостей.
   Прячет подстановку CMS-контента из Supabase; адаптивное качество (coarse/weak). */
(function(){
  var L=document.getElementById('fiqLoader');
  if(!L)return;
  var path=location.pathname;
  if(path!=='/'&&path!=='/index.html'){L.parentNode.removeChild(L);return;}
  function kill(){try{if(L.parentNode)L.parentNode.removeChild(L);}catch(e){} delete window.__fiq;}
  try{
    var cv=document.getElementById('flCv'),ctx=cv.getContext('2d');
    var numEl=document.getElementById('flNum'),barEl=document.getElementById('flBar');
    var coarse=matchMedia('(hover: none), (pointer: coarse)').matches;
    var weak=(navigator.deviceMemory||8)<=4||(navigator.hardwareConcurrency||8)<=4;
    var DPR=Math.min(devicePixelRatio||1,weak?1.5:2);
    var vw=0,vh=0;
    function size(){vw=innerWidth;vh=innerHeight;cv.width=vw*DPR;cv.height=vh*DPR;cv.style.width=vw+'px';cv.style.height=vh+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
    size();addEventListener('resize',size);
    /* сетка GX×GY: десктоп шире, мобилка выше; weak — реже */
    var GX=coarse?(weak?11:13):(weak?18:24);
    var GY=coarse?(weak?14:17):(weak?11:14);
    var N=GX*GY,pts=[],i,gx,gy;
    for(gy=0;gy<GY;gy++)for(gx=0;gx<GX;gx++){
      pts.push({
        u:gx/(GX-1)-.5, v:gy/(GY-1)-.5,
        rx:(Math.random()-.5)*2.4, ry:(Math.random()-.5)*2.4, rz:(Math.random()-.5)*2.4,
        dl:Math.random()*.5, ph:Math.random()*6.283,
        x:0,y:0,a:0
      });
    }
    var t0=performance.now(),state=1,morphT0=0,removed=false;
    var evT=8,disp=0,lastInt=-1,lastBar=-1;
    var MINSHOW=1250,ASM=780,MORPH=850,FADEALL=1450;
    function easeOC(t){t=1-t;return 1-t*t*t;}
    function easeIO(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
    function clamp(v,a,b){return v<a?a:(v>b?b:v);}
    function startMorph(){if(state>=3)return;state=3;morphT0=performance.now();evT=100;L.classList.add('fl-go');}
    function finish(){
      if(state>=2)return;state=2;
      var el=performance.now()-t0;
      setTimeout(startMorph,Math.max(0,MINSHOW-el));
    }
    window.__fiq={set:function(v){if(v>evT&&state<3)evT=v;},done:finish};
    addEventListener('DOMContentLoaded',function(){if(evT<38)evT=38;});
    addEventListener('load',function(){if(evT<60)evT=60;});
    setTimeout(finish,4200); /* страховка: не держим экран дольше */
    var rafId=0;
    function frame(now){
      if(removed)return;
      var et=now-t0;
      /* прогресс: события + временной дожим */
      var tgt=Math.max(evT,Math.min(86,et/45));if(tgt>100)tgt=100;
      disp+=(tgt-disp)*.09;
      var di=Math.round(disp);
      if(di!==lastInt){lastInt=di;numEl.textContent=(di<10?'0':'')+di;}
      if(di!==lastBar){lastBar=di;barEl.style.transform='scaleX('+(disp/100).toFixed(3)+')';}
      /* морф-фаза */
      var m=0;
      if(state===3){
        var me=now-morphT0;
        m=easeIO(clamp(me/MORPH,0,1));
        if(me>MORPH*.55&&!L.classList.contains('fl-out'))L.classList.add('fl-out');
        if(me>FADEALL){removed=true;cancelAnimationFrame(rafId);kill();return;}
      }
      ctx.clearRect(0,0,vw,vh);
      /* параметры плоскости-сетки */
      var span=Math.max(vw,vh)*1.5;
      var amp=Math.min(vw,vh)*.09*(1+Math.sin(et*.0009)*.25);
      var ry_=Math.sin(et*.00028)*.3, rx_=-.52;
      var cy_=Math.cos(ry_),sy_=Math.sin(ry_),cx_=Math.cos(rx_),sx_=Math.sin(rx_);
      var CXg=vw*.5,CYg=vh*.5,Fg=Math.max(vw,vh)*.95,ZOFF=span*.62;
      /* параметры спирали (совпадают с нейро-столпом лендинга) */
      var CXh=vw*(coarse?.5:.70),CYh=vh*.5,baseR=Math.min(vw,vh)*(coarse?.34:.26),Hh=vh*1.5,rotH=now*.00004;
      var scan=(et*.00045)%1*GY; /* бегущая строка-скан */
      var p,k,ts,x3,y3,z3,x1,z1,y2,z2,s,hx,hz,hs,ha,hr;
      for(i=0;i<N;i++){
        p=pts[i];
        /* сборка из разлёта */
        ts=clamp((et-p.dl*ASM*.55)/ASM,0,1);k=easeOC(ts);
        x3=(p.rx+(p.u-p.rx)*k)*span;
        z3=(p.rz+(p.v-p.rz)*k)*span*.95;
        y3=(p.ry*(1-k))*span*.5+Math.sin(p.u*6.1+et*.0016)*Math.cos(p.v*5.3+et*.0011)*amp*k;
        x1=x3*cy_+z3*sy_;z1=-x3*sy_+z3*cy_;
        y2=y3*cx_-z1*sx_;z2=y3*sx_+z1*cx_;
        s=Fg/(Fg+z2+ZOFF);
        var px=CXg+x1*s,py=CYg+y2*s;
        if(m>0){
          ha=i*2.39996+rotH;hr=baseR*(.78+.3*Math.sin(i*1.7));
          hx=Math.cos(ha)*hr;hz=Math.sin(ha)*hr;
          hs=900/(900+hz+baseR*1.4);
          px+=(CXh+hx*hs-px)*m;
          py+=(CYh+(i/N-.5)*Hh*hs-py)*m;
          s+=(hs-s)*m;
        }
        p.x=px;p.y=py;p.a=clamp(s*1.7-.45,0,1)*k;
      }
      /* линии сетки: сосед справа + сосед снизу */
      ctx.lineWidth=1;
      var lf=1-m*.55;
      for(gy=0;gy<GY;gy++){
        var rowB=Math.max(0,1-Math.abs(gy-scan)*.9)*.55; /* подсветка скана */
        for(gx=0;gx<GX;gx++){
          i=gy*GX+gx;p=pts[i];
          if(p.a<=0)continue;
          if(gx<GX-1){
            var q=pts[i+1],al=(p.a+q.a)*.5*(0.20+rowB)*lf;
            if(al>.008){ctx.strokeStyle='rgba(184,255,0,'+al.toFixed(3)+')';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
          }
          if(gy<GY-1){
            var w=pts[i+GX],al2=(p.a+w.a)*.5*.16*lf;
            if(al2>.008){ctx.strokeStyle='rgba(184,255,0,'+al2.toFixed(3)+')';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(w.x,w.y);ctx.stroke();}
          }
        }
      }
      /* узлы */
      for(i=0;i<N;i++){
        p=pts[i];if(p.a<=0)continue;
        var fl=.6+.4*Math.sin(et*.0012+p.ph);
        var na=clamp(p.a*fl*.95,0,1);
        ctx.fillStyle=p.ph%1<.2?'rgba(184,255,0,'+na.toFixed(3)+')':'rgba(245,245,240,'+(na*.75).toFixed(3)+')';
        ctx.beginPath();ctx.arc(p.x,p.y,1.1+p.a*1.9,0,6.283);ctx.fill();
      }
      rafId=requestAnimationFrame(frame);
    }
    rafId=requestAnimationFrame(frame);
  }catch(e){kill();}
})();
</script>
<div id="root"><!--app-html--></div>
